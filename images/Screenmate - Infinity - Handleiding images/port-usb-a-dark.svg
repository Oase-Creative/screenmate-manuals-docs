<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" role="img" aria-label="USB-A port">
  <style>
    .stroke { fill: none; stroke: #f5f5f5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fill   { fill: #f5f5f5; }
  </style>
  <!-- USB-A connector outline: rectangle -->
  <rect x="14" y="18" width="100" height="28" rx="2" class="stroke"/>
  <!-- Inner tab (offset to one side, classic USB-A look) -->
  <rect x="22" y="24" width="84" height="10" rx="1" class="fill"/>
</svg>
