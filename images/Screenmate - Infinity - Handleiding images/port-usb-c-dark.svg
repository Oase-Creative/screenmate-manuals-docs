<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" role="img" aria-label="USB-C port">
  <style>
    .stroke { fill: none; stroke: #f5f5f5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fill   { fill: #f5f5f5; }
    .lbl    { font: 600 18px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f5f5; }
  </style>
  <!-- USB-C connector outline: pill shape -->
  <rect x="20" y="18" width="88" height="28" rx="14" class="stroke"/>
  <!-- Inner connector tab -->
  <rect x="32" y="28" width="64" height="8" rx="4" class="fill"/>
</svg>
