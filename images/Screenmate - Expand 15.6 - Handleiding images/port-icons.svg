<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" role="img" aria-label="USB-C, HDMI and USB-A port icons">
  <style>
    .stroke { fill: none; stroke: #1a1a1a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fill   { fill: #1a1a1a; }
    .label  { font: 600 18px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; text-anchor: middle; }
  </style>

  <!-- USB-C port -->
  <g transform="translate(110,60)">
    <rect x="-55" y="-15" width="110" height="30" rx="15" ry="15" class="stroke"/>
    <rect x="-40" y="-7" width="80" height="14" rx="7" ry="7" fill="#1a1a1a"/>
    <rect x="-32" y="-3" width="64" height="6" rx="3" ry="3" fill="#fff"/>
  </g>
  <text x="110" y="140" class="label">USB-C</text>

  <!-- HDMI port -->
  <g transform="translate(330,60)">
    <path d="M -55 -10 L -40 -20 L 40 -20 L 55 -10 L 55 10 L 40 20 L -40 20 L -55 10 Z" class="stroke"/>
    <g class="fill">
      <rect x="-38" y="-8" width="3" height="6"/>
      <rect x="-30" y="-8" width="3" height="6"/>
      <rect x="-22" y="-8" width="3" height="6"/>
      <rect x="-14" y="-8" width="3" height="6"/>
      <rect x="-6" y="-8" width="3" height="6"/>
      <rect x="2" y="-8" width="3" height="6"/>
      <rect x="10" y="-8" width="3" height="6"/>
      <rect x="18" y="-8" width="3" height="6"/>
      <rect x="26" y="-8" width="3" height="6"/>
      <rect x="34" y="-8" width="3" height="6"/>
    </g>
  </g>
  <text x="330" y="140" class="label">HDMI</text>

  <!-- USB-A port -->
  <g transform="translate(550,60)">
    <rect x="-50" y="-18" width="100" height="36" class="stroke"/>
    <rect x="-40" y="-2" width="80" height="14" fill="#1a1a1a"/>
    <rect x="-32" y="2" width="14" height="6" fill="#fff"/>
    <rect x="-10" y="2" width="14" height="6" fill="#fff"/>
    <rect x="12" y="2" width="14" height="6" fill="#fff"/>
  </g>
  <text x="550" y="140" class="label">USB-A</text>
</svg>
