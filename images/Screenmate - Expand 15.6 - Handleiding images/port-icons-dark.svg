<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" role="img" aria-label="USB-C, HDMI and USB-A port icons">
  <style>
    .label { font: 600 18px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f5f5; text-anchor: middle; }
  </style>
  <!-- USB-C -->
  <g transform="translate(110,70) scale(1.0)"><rect x="-44" y="-16" width="88" height="32" rx="16" ry="16" fill="none" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round"/><rect x="-30" y="-7" width="60" height="14" rx="7" ry="7" fill="#f5f5f5"/></g>
  <text x="110" y="140" class="label">USB-C</text>
  <!-- HDMI (realistic Type-A) -->
  <g transform="translate(330,70) scale(1.0)"><path d="M -52 -18 L 52 -18 L 45 7 L 39 7 L 35 16 L -31 16 L -35 7 L -41 7 Z" fill="none" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="-42" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="-33" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="-24" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="-15" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="-6" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="3" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="12" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="21" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="30" y="-12" width="4" height="11" fill="#f5f5f5"/><rect x="39" y="-12" width="4" height="11" fill="#f5f5f5"/></g>
  <text x="330" y="140" class="label">HDMI</text>
  <!-- USB-A -->
  <g transform="translate(550,70) scale(1.0)"><rect x="-48" y="-18" width="96" height="36" rx="2" fill="none" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round"/><rect x="-39" y="-1" width="18" height="13" fill="#f5f5f5"/><rect x="-19" y="-1" width="18" height="13" fill="#f5f5f5"/><rect x="1" y="-1" width="18" height="13" fill="#f5f5f5"/><rect x="21" y="-1" width="18" height="13" fill="#f5f5f5"/></g>
  <text x="550" y="140" class="label">USB-A</text>
</svg>
